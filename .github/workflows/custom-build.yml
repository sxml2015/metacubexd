name: Build Custom MetaCubeXD
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Patch mobile 2-column grid
        run: |
          find src -type f -name "*.tsx" -exec sed -i 's/grid-cols-1 gap-2 sm:grid-cols-2/grid-cols-2 gap-1.5 sm:grid-cols-2/g' {} +
          find src -type f -name "*.tsx" -exec sed -i 's/grid-cols-1 sm:grid-cols-2/grid-cols-2 sm:grid-cols-2/g' {} +

      - name: Install and Build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: metacubexd-dist-patched
          path: dist/
