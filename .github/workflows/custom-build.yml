name: Build Custom MetaCubeXD
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Patch mobile 2-column grid
        run: |
          # 1. 替换 packages/ui 下的单列网格为双列
          grep -rl "grid-cols-1" packages/ui --exclude-dir={node_modules,.nuxt,.output} | xargs -r sed -i 's/grid-cols-1/grid-cols-2/g' || true

          # 2. 向 packages/ui/assets 下的主样式文件追加手机端强制双列 CSS 规则
          CSS_FILE=$(find packages/ui/assets -type f -name "*.css" | head -n 1)
          if [ -n "$CSS_FILE" ]; then
            echo "Injecting mobile 2-column CSS into $CSS_FILE"
            cat << 'EOF' >> "$CSS_FILE"
          @media (max-width: 640px) {
            .grid {
              grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
              gap: 0.375rem !important;
            }
          }
          EOF
          fi

      - name: Install and Build UI
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @metacubexd/ui generate || pnpm --filter ui generate || pnpm build

      - name: Package build output
        run: |
          # Nuxt 3 静态产物目录位于 packages/ui/.output/public
          OUT_DIR=$(find packages/ui -type f -name "index.html" -path "*/.output/public/*" | head -n 1 | xargs dirname)
          if [ -z "$OUT_DIR" ]; then
            OUT_DIR="packages/ui/.output/public"
          fi
          echo "Detected exact build directory: $OUT_DIR"
          cd "$OUT_DIR"
          zip -r "$GITHUB_WORKSPACE/metacubexd-dist-patched.zip" ./*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-latest
          name: Custom Build (Mobile 2-Column)
          files: metacubexd-dist-patched.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
