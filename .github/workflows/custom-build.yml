name: 重构面板 Build Custom MetaCubeXD
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Patch UI Components & Styles
        run: |
          # 1. 代理节点网格保持双列（手机端）
          find packages/ui/components -type f -name "*.vue" -exec grep -l "grid-cols-1" {} + | xargs -r sed -i 's/grid-cols-1/grid-cols-2/g' || true

          # 2. 选中节点使用高对比度主题色背景高亮
          find packages/ui/components -type f -name "*Proxy*.vue" -exec sed -i 's/border-primary/border-primary bg-primary\/85 text-primary-content/g' {} + || true

          # 3. 注入 CSS：修复配置页单列布局 + 选中节点延迟胶囊加深底色
          CSS_FILE=$(find packages/ui/assets -type f -name "*.css" | head -n 1)
          if [ -n "$CSS_FILE" ]; then
            echo "Injecting custom layout CSS into $CSS_FILE"
            cat << 'EOF' >> "$CSS_FILE"

          @media (max-width: 640px) {
            main .grid.grid-cols-2:has(input),
            main .grid.grid-cols-2:has(select),
            main .grid.md\:grid-cols-2 {
              grid-template-columns: minmax(0, 1fr) !important;
            }
          }

          /* 仅针对选中状态节点卡片内的延迟数字胶囊加深底色 */
          .border-primary[class*="bg-primary"] .badge,
          .border-primary[class*="bg-primary"] [class*="rounded"][class*="px-"] {
            background-color: #161a1e !important;
            font-weight: 700 !important;
          }
          EOF
          fi

          # 4. 编写完整交互增强插件（修复设置面板挂载条件，确保100%可见）
          mkdir -p packages/ui/plugins
          cat << 'EOF' > packages/ui/plugins/custom-mobile-ux.client.ts
          export default defineNuxtPlugin(() => {
            if (typeof window === 'undefined') return

            const initHash = window.location.hash
            if (initHash === '' || initHash === '#/' || initHash === '#') {
              window.location.replace('#/proxies')
            }

            const STORAGE_KEY = 'custom_fixed_groups_cfg_v1'
            const DEFAULT_CFG = {
              enabled: true,
              keywords: ['YouTube', 'Google', 'Telegram', 'Agnet', 'Agent', 'GitHub', '🐤 X', 'AV}', 'TikTok'],
              exactGroups: [] as string[]
            }

            const getFixedConfig = () => {
              try {
                const raw = localStorage.getItem(STORAGE_KEY)
                if (raw) return { ...DEFAULT_CFG, ...JSON.parse(raw) }
              } catch {}
              return { ...DEFAULT_CFG }
            }

            const saveFixedConfig = (cfg: typeof DEFAULT_CFG) => {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg))
              syncOriginalGroupOrders()
            }

            const isGroupFixed = (gName: string) => {
              const cfg = getFixedConfig()
              if (!cfg.enabled) return false
              if (cfg.exactGroups.includes(gName)) return true
              const cleanName = gName.trim()
              return cfg.keywords.some((kw: string) => {
                const k = kw.trim()
                if (!k) return false
                if (k === 'X' || k === '🐤 X') return cleanName === 'X' || cleanName.includes('🐤 X')
                return cleanName.toLowerCase().includes(k.toLowerCase())
              })
            }

            const getApiConfig = () => {
              let url = window.location.origin
              let secret = ''

              for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i)
                if (!key) continue
                const val = localStorage.getItem(key) || ''
                if (val.includes('http://') || val.includes('https://')) {
                  try {
                    const parsed = JSON.parse(val)
                    const list = Array.isArray(parsed) ? parsed : [parsed]
                    const found = list.find((item: any) => item && typeof item === 'object' && typeof item.url === 'string' && item.url.startsWith('http'))
                    if (found) {
                      url = found.url.replace(/\/$/, '')
                      secret = found.secret || ''
                      break
                    }
                  } catch {
                    if (val.startsWith('http://') || val.startsWith('https://')) {
                      url = val.replace(/\/$/, '')
                    }
                  }
                }
              }

              const fullHref = window.location.href
              const secretMatch = fullHref.match(/[?&]secret=([^&#]+)/)
              if (secretMatch && !secret) secret = decodeURIComponent(secretMatch[1])
              const hostMatch = fullHref.match(/[?&]hostname=([^&#]+)/)
              const portMatch = fullHref.match(/[?&]port=([^&#]+)/)
              if (hostMatch && portMatch) {
                const proto = fullHref.includes('https=true') ? 'https' : 'http'
                url = `${proto}://${decodeURIComponent(hostMatch[1])}:${decodeURIComponent(portMatch[1])}`
              }

              return { url, secret }
            }

            let allSelectorGroups: string[] = []
            let originalOrderMap: Record<string, Record<string, number>> = {}

            const syncOriginalGroupOrders = async () => {
              try {
                const { url, secret } = getApiConfig()
                const headers: Record<string, string> = {}
                if (secret) headers['Authorization'] = `Bearer ${secret}`
                const res = await fetch(`${url}/proxies`, { headers })
                if (!res.ok) return
                const data = await res.json()
                const proxies = data?.proxies || {}
                const map: Record<string, Record<string, number>> = {}
                const groups: string[] = []

                for (const [gName, gInfo] of Object.entries<any>(proxies)) {
                  if (Array.isArray(gInfo?.all) && gName !== 'GLOBAL') {
                    groups.push(gName)
                    if (isGroupFixed(gName)) {
                      map[gName] = {}
                      gInfo.all.forEach((nodeName: string, idx: number) => {
                        map[gName][nodeName] = idx
                      })
                    }
                  }
                }
                allSelectorGroups = groups
                originalOrderMap = map
              } catch {}
            }

            const applyFixedGroupDomOrder = () => {
              const headers = Array.from(document.querySelectorAll('h2, h3, [class*="collapse-title"], [class*="group"]'))
              for (const h of headers) {
                const rawTitle = (h.textContent || '').trim()
                const matchedGroup = Object.keys(originalOrderMap).find(g => rawTitle.includes(g))
                const container = h.closest('[class*="rounded"]') || h.parentElement?.parentElement
                if (!container) continue
                const grid = container.querySelector('.grid') as HTMLElement | null
                if (!grid) continue
                const cards = Array.from(grid.children) as HTMLElement[]

                if (!matchedGroup) {
                  cards.forEach(card => { if (card.style.order) card.style.order = '' })
                  continue
                }

                const orderDict = originalOrderMap[matchedGroup]
                if (cards.length < 2) continue

                cards.forEach((card) => {
                  const text = (card.textContent || '').trim()
                  let foundIdx = 9999
                  for (const [nodeName, idx] of Object.entries(orderDict)) {
                    if (text.startsWith(nodeName) || text.includes(nodeName)) {
                      foundIdx = idx
                      break
                    }
                  }
                  if (card.style.order !== String(foundIdx)) {
                    card.style.order = String(foundIdx)
                  }
                })
              }
            }

            // 修复：兼容所有路由路径与DOM结构，在配置页面100%显示可视化设置卡片
            const mountConfigPanel = () => {
              const fullUrl = window.location.href.toLowerCase()
              const bodyText = document.body.innerText || ''
              const isConfigPage = fullUrl.includes('config') || fullUrl.includes('setting') || (bodyText.includes('核心配置') && bodyText.includes('XD 配置'))
              if (!isConfigPage) return
              if (document.getElementById('custom-fixed-groups-panel')) return

              // 寻找“核心配置 / XD 配置”选项卡栏，把设置卡片紧贴在它正下方
              const tabsEl = Array.from(document.querySelectorAll('div, nav')).find(el => {
                const t = (el.textContent || '').trim()
                return t.includes('核心配置') && t.includes('XD 配置') && t.length < 60
              })

              const targetContainer = tabsEl?.parentElement || document.querySelector('main') || document.querySelector('.overflow-y-auto') || document.body
              if (!targetContainer) return

              const cfg = getFixedConfig()
              const panel = document.createElement('div')
              panel.id = 'custom-fixed-groups-panel'
              panel.style.cssText = 'margin:12px 0;padding:14px;border-radius:12px;background:#1e232a;border:1px solid rgba(56,189,248,0.35);color:#fff;font-size:13px;z-index:20;position:relative;'

              panel.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                  <strong style="font-size:15px;color:#38bdf8;">📌 策略组固定排序设置（不随延迟重排）</strong>
                  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                    <input type="checkbox" id="cfg-fixed-enable" ${cfg.enabled ? 'checked' : ''} style="width:16px;height:16px;accent-color:#38bdf8;" />
                    <span>总开关</span>
                  </label>
                </div>
                <div style="margin-bottom:10px;">
                  <div style="color:#94a3b8;font-size:12px;margin-bottom:4px;">关键词匹配（英文逗号分隔，含以下文字的组自动保持自建节点固定在前的原始顺序）：</div>
                  <input type="text" id="cfg-fixed-keywords" value="${cfg.keywords.join(', ')}" style="width:100%;padding:6px 10px;border-radius:8px;background:#0f172a;border:1px solid #334155;color:#f8fafc;font-size:12px;" />
                </div>
                <div style="color:#94a3b8;font-size:12px;margin-bottom:6px;">当前策略组快速勾选（新增组可直接勾选）：</div>
                <div id="cfg-fixed-checkboxes" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
              `

              if (tabsEl && tabsEl.nextSibling) {
                targetContainer.insertBefore(panel, tabsEl.nextSibling)
              } else {
                targetContainer.prepend(panel)
              }

              const renderCheckboxes = () => {
                const boxWrap = document.getElementById('cfg-fixed-checkboxes')
                if (!boxWrap) return
                if (!allSelectorGroups.length) {
                  boxWrap.innerHTML = '<span style="color:#64748b;font-size:12px;">正在读取策略组列表...</span>'
                  syncOriginalGroupOrders().then(() => {
                    if (allSelectorGroups.length) renderCheckboxes()
                  })
                  return
                }
                boxWrap.innerHTML = ''
                allSelectorGroups.forEach(gName => {
                  const active = isGroupFixed(gName)
                  const tag = document.createElement('label')
                  tag.style.cssText = `display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid ${active ? '#38bdf8' : '#334155'};background:${active ? 'rgba(56,189,248,0.18)' : '#0f172a'};`
                  const cb = document.createElement('input')
                  cb.type = 'checkbox'
                  cb.checked = active
                  cb.style.accentColor = '#38bdf8'
                  cb.onchange = () => {
                    const next = getFixedConfig()
                    if (cb.checked) {
                      if (!next.exactGroups.includes(gName)) next.exactGroups.push(gName)
                    } else {
                      next.exactGroups = next.exactGroups.filter((x: string) => x !== gName)
                      next.keywords = next.keywords.filter((kw: string) => !gName.toLowerCase().includes(kw.trim().toLowerCase()))
                      const kwInput = document.getElementById('cfg-fixed-keywords') as HTMLInputElement | null
                      if (kwInput) kwInput.value = next.keywords.join(', ')
                    }
                    saveFixedConfig(next)
                    renderCheckboxes()
                  }
                  const span = document.createElement('span')
                  span.innerText = gName
                  tag.appendChild(cb)
                  tag.appendChild(span)
                  boxWrap.appendChild(tag)
                })
              }

              renderCheckboxes()

              const enableCb = document.getElementById('cfg-fixed-enable') as HTMLInputElement
              enableCb.onchange = () => {
                const next = getFixedConfig()
                next.enabled = enableCb.checked
                saveFixedConfig(next)
                renderCheckboxes()
              }

              const kwInput = document.getElementById('cfg-fixed-keywords') as HTMLInputElement
              kwInput.onchange = () => {
                const next = getFixedConfig()
                next.keywords = kwInput.value.split(/[,，]/).map(s => s.trim()).filter(Boolean)
                saveFixedConfig(next)
                renderCheckboxes()
              }
            }

            setTimeout(syncOriginalGroupOrders, 800)
            setInterval(syncOriginalGroupOrders, 15000)

            const flushCache = async (type: 'fakeip' | 'dns', btn: HTMLButtonElement) => {
              const origText = btn.innerText
              btn.innerText = '清理中...'
              try {
                const { url, secret } = getApiConfig()
                const headers: Record<string, string> = { 'Content-Type': 'application/json' }
                if (secret) headers['Authorization'] = `Bearer ${secret}`
                const res = await fetch(`${url}/cache/${type}/flush`, { method: 'POST', headers })
                if (res.ok) {
                  btn.innerText = '已清空 ✓'
                } else {
                  btn.innerText = `失败(${res.status})`
                }
              } catch {
                btn.innerText = '网络错误'
              }
              setTimeout(() => { btn.innerText = origText }, 1500)
            }

            const mkFlushBtn = (label: string, type: 'fakeip' | 'dns', bg: string, isDesktop: boolean) => {
              const b = document.createElement('button')
              b.innerText = label
              b.style.cssText = isDesktop
                ? `width:100%;padding:10px 14px;border-radius:10px;background:${bg};color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,0.25);`
                : `padding:4px 10px;border-radius:8px;background:${bg};color:#fff;font-size:12px;font-weight:600;border:none;cursor:pointer;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.3);`
              b.onclick = (e) => {
                e.preventDefault()
                e.stopPropagation()
                flushCache(type, b)
              }
              return b
            }

            const enhanceNavigation = () => {
              applyFixedGroupDomOrder()
              mountConfigPanel()

              const desktopNav = document.querySelector('aside nav') || document.querySelector('nav')
              if (desktopNav && window.innerWidth >= 768 && !document.getElementById('custom-desktop-flush')) {
                const box = document.createElement('div')
                box.id = 'custom-desktop-flush'
                box.style.cssText = 'display:flex;flex-direction:column;gap:8px;padding:12px;margin-top:8px;border-top:1px solid rgba(255,255,255,0.1);'
                box.appendChild(mkFlushBtn('清空 Fake-IP', 'fakeip', '#8b5cf6', true))
                box.appendChild(mkFlushBtn('清空 DNS 缓存', 'dns', '#0ea5e9', true))
                desktopNav.appendChild(box)
              }

              if (window.innerWidth < 768) {
                const allEls = Array.from(document.querySelectorAll('div, nav, footer'))
                const mobileDock = allEls.find(el => {
                  const style = window.getComputedStyle(el)
                  return style.position === 'fixed' && parseInt(style.bottom || '999') <= 24 && el.innerText.includes('概览') && el.innerText.includes('代理')
                }) as HTMLElement | undefined

                if (mobileDock) {
                  const btns = Array.from(mobileDock.querySelectorAll('button, a'))
                  const moreBtn = btns.find(b => b.textContent?.includes('更多')) as HTMLElement | undefined
                  if (moreBtn && !moreBtn.dataset.patchedConfig) {
                    moreBtn.dataset.patchedConfig = '1'
                    moreBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span style="font-size:11px;margin-top:2px;">配置</span>`
                    moreBtn.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent;border:none;box-shadow:none;width:auto;height:auto;padding:4px 8px;'
                    moreBtn.onclick = (e) => {
                      e.preventDefault()
                      e.stopPropagation()
                      window.location.hash = '#/config'
                    }
                  }

                  if (!document.getElementById('custom-mobile-flush')) {
                    const mBox = document.createElement('div')
                    mBox.id = 'custom-mobile-flush'
                    mBox.style.cssText = 'position:fixed;right:12px;bottom:76px;z-index:45;display:flex;gap:8px;'
                    mBox.appendChild(mkFlushBtn('清 Fake-IP', 'fakeip', '#8b5cf6', false))
                    mBox.appendChild(mkFlushBtn('清 DNS', 'dns', '#0ea5e9', false))
                    document.body.appendChild(mBox)
                  }
                }
              }
            }

            setInterval(enhanceNavigation, 600)
          })
          EOF

      - name: Install and Build UI
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @metacubexd/ui generate || pnpm --filter ui generate || pnpm build

      - name: Package build output
        run: |
          OUT_DIR=$(find packages/ui -type f -name "index.html" -path "*/.output/public/*" | head -n 1 | xargs dirname)
          if [ -z "$OUT_DIR" ]; then
            OUT_DIR="packages/ui/.output/public"
          fi
          echo "Detected exact build directory: $OUT_DIR"
          cd "$OUT_DIR"

          grep -rl "/_nuxt/" . | xargs -r sed -i 's|"/_nuxt/|"./_nuxt/|g; s|'"'"'/_nuxt/|'"'"'./_nuxt/|g'
          rm -f sw.js workbox-*.js

          zip -r "$GITHUB_WORKSPACE/metacubexd-dist-patched.zip" ./*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-latest
          name: Custom Build (Mobile 2-Column)
          files: metacubexd-dist-patched.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
