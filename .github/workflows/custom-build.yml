name: Build Custom MetaCubeXD
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Patch UI Components & Styles
        run: |
          # 1. 代理节点网格保持双列（手机端）
          find packages/ui/components -type f -name "*.vue" -exec grep -l "grid-cols-1" {} + | xargs -r sed -i 's/grid-cols-1/grid-cols-2/g' || true

          # 2. 选中节点使用高对比度主题色背景高亮
          find packages/ui/components -type f -name "*Proxy*.vue" -exec sed -i 's/border-primary/border-primary bg-primary\/85 text-primary-content/g' {} + || true

          # 3. 注入 CSS：修复配置页手机端单列上下布局
          CSS_FILE=$(find packages/ui/assets -type f -name "*.css" | head -n 1)
          if [ -n "$CSS_FILE" ]; then
            echo "Injecting custom layout CSS into $CSS_FILE"
            cat << 'EOF' >> "$CSS_FILE"

          @media (max-width: 640px) {
            main .grid.grid-cols-2:has(input),
            main .grid.grid-cols-2:has(select),
            main .grid.md\:grid-cols-2 {
              grid-template-columns: minmax(0, 1fr) !important;
            }
          }
          EOF
          fi

          # 4. 编写完整交互增强插件（智能匹配后端地址与密钥）
          mkdir -p packages/ui/plugins
          cat << 'EOF' > packages/ui/plugins/custom-mobile-ux.client.ts
          export default defineNuxtPlugin(() => {
            if (typeof window === 'undefined') return

            // 仅首次打开根目录时跳转到代理页
            const initHash = window.location.hash
            if (initHash === '' || initHash === '#/' || initHash === '#') {
              window.location.replace('#/proxies')
            }

            // 智能提取当前连接的 Clash/mihomo 后端地址与 Secret 密钥
            const getApiConfig = () => {
              let url = window.location.origin
              let secret = ''

              // 1. 优先遍历 localStorage 寻找包含 url 和 secret 的后端配置对象
              for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i)
                if (!key) continue
                const val = localStorage.getItem(key) || ''
                if (val.includes('http://') || val.includes('https://')) {
                  try {
                    const parsed = JSON.parse(val)
                    const list = Array.isArray(parsed) ? parsed : [parsed]
                    const found = list.find((item: any) => item && typeof item === 'object' && typeof item.url === 'string' && item.url.startsWith('http'))
                    if (found) {
                      url = found.url.replace(/\/$/, '')
                      secret = found.secret || ''
                      break
                    }
                  } catch {
                    if (val.startsWith('http://') || val.startsWith('https://')) {
                      url = val.replace(/\/$/, '')
                    }
                  }
                }
              }

              // 2. 兜底：检查 URL Hash 或 Search 参数中的 secret / hostname / port
              const fullHref = window.location.href
              const secretMatch = fullHref.match(/[?&]secret=([^&#]+)/)
              if (secretMatch && !secret) {
                secret = decodeURIComponent(secretMatch[1])
              }
              const hostMatch = fullHref.match(/[?&]hostname=([^&#]+)/)
              const portMatch = fullHref.match(/[?&]port=([^&#]+)/)
              if (hostMatch && portMatch) {
                const proto = fullHref.includes('https=true') ? 'https' : 'http'
                url = `${proto}://${decodeURIComponent(hostMatch[1])}:${decodeURIComponent(portMatch[1])}`
              }

              return { url, secret }
            }

            const flushCache = async (type: 'fakeip' | 'dns', btn: HTMLButtonElement) => {
              const origText = btn.innerText
              btn.innerText = '清理中...'
              try {
                const { url, secret } = getApiConfig()
                const headers: Record<string, string> = { 'Content-Type': 'application/json' }
                if (secret) headers['Authorization'] = `Bearer ${secret}`
                const res = await fetch(`${url}/cache/${type}/flush`, { method: 'POST', headers })
                if (res.ok) {
                  btn.innerText = '已清空 ✓'
                } else {
                  console.error(`[CustomUX] Flush ${type} failed:`, res.status, url)
                  btn.innerText = `失败(${res.status})`
                }
              } catch (err) {
                console.error(`[CustomUX] Flush ${type} error:`, err)
                btn.innerText = '网络错误'
              }
              setTimeout(() => { btn.innerText = origText }, 1500)
            }

            const mkFlushBtn = (label: string, type: 'fakeip' | 'dns', bg: string, isDesktop: boolean) => {
              const b = document.createElement('button')
              b.innerText = label
              b.style.cssText = isDesktop
                ? `width:100%;padding:10px 14px;border-radius:10px;background:${bg};color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,0.25);`
                : `padding:4px 10px;border-radius:8px;background:${bg};color:#fff;font-size:12px;font-weight:600;border:none;cursor:pointer;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.3);`
              b.onclick = (e) => {
                e.preventDefault()
                e.stopPropagation()
                flushCache(type, b)
              }
              return b
            }

            const enhanceNavigation = () => {
              // 电脑端左侧导航栏
              const desktopNav = document.querySelector('aside nav') || document.querySelector('nav')
              if (desktopNav && window.innerWidth >= 768 && !document.getElementById('custom-desktop-flush')) {
                const box = document.createElement('div')
                box.id = 'custom-desktop-flush'
                box.style.cssText = 'display:flex;flex-direction:column;gap:8px;padding:12px;margin-top:8px;border-top:1px solid rgba(255,255,255,0.1);'
                box.appendChild(mkFlushBtn('清空 Fake-IP', 'fakeip', '#8b5cf6', true))
                box.appendChild(mkFlushBtn('清空 DNS 缓存', 'dns', '#0ea5e9', true))
                desktopNav.appendChild(box)
              }

              // 手机端底部导航改造
              if (window.innerWidth < 768) {
                const allEls = Array.from(document.querySelectorAll('div, nav, footer'))
                const mobileDock = allEls.find(el => {
                  const style = window.getComputedStyle(el)
                  return style.position === 'fixed' && parseInt(style.bottom || '999') <= 24 && el.innerText.includes('概览') && el.innerText.includes('代理')
                }) as HTMLElement | undefined

                if (mobileDock) {
                  const btns = Array.from(mobileDock.querySelectorAll('button, a'))
                  const moreBtn = btns.find(b => b.textContent?.includes('更多')) as HTMLElement | undefined
                  if (moreBtn && !moreBtn.dataset.patchedConfig) {
                    moreBtn.dataset.patchedConfig = '1'
                    moreBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span style="font-size:11px;margin-top:2px;">配置</span>`
                    moreBtn.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent;border:none;box-shadow:none;width:auto;height:auto;padding:4px 8px;'
                    moreBtn.onclick = (e) => {
                      e.preventDefault()
                      e.stopPropagation()
                      window.location.hash = '#/config'
                    }
                  }

                  if (!document.getElementById('custom-mobile-flush')) {
                    const mBox = document.createElement('div')
                    mBox.id = 'custom-mobile-flush'
                    mBox.style.cssText = 'position:fixed;right:12px;bottom:76px;z-index:45;display:flex;gap:8px;'
                    mBox.appendChild(mkFlushBtn('清 Fake-IP', 'fakeip', '#8b5cf6', false))
                    mBox.appendChild(mkFlushBtn('清 DNS', 'dns', '#0ea5e9', false))
                    document.body.appendChild(mBox)
                  }
                }
              }
            }

            setInterval(enhanceNavigation, 800)
          })
          EOF

      - name: Install and Build UI
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @metacubexd/ui generate || pnpm --filter ui generate || pnpm build

      - name: Package build output
        run: |
          OUT_DIR=$(find packages/ui -type f -name "index.html" -path "*/.output/public/*" | head -n 1 | xargs dirname)
          if [ -z "$OUT_DIR" ]; then
            OUT_DIR="packages/ui/.output/public"
          fi
          echo "Detected exact build directory: $OUT_DIR"
          cd "$OUT_DIR"

          grep -rl "/_nuxt/" . | xargs -r sed -i 's|"/_nuxt/|"./_nuxt/|g; s|'"'"'/_nuxt/|'"'"'./_nuxt/|g'
          rm -f sw.js workbox-*.js

          zip -r "$GITHUB_WORKSPACE/metacubexd-dist-patched.zip" ./*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-latest
          name: Custom Build (Mobile 2-Column)
          files: metacubexd-dist-patched.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
