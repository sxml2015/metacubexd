name: Build Custom MetaCubeXD
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Patch mobile 2-column grid
        run: |
          # 1. 尝试替换源码中的 grid-cols-1（找不到安全跳过）
          grep -rl "grid-cols-1" . --exclude-dir={node_modules,.git} | xargs -r sed -i 's/grid-cols-1/grid-cols-2/g' || true

          # 2. 向主样式文件追加手机端强制双列 CSS 规则
          CSS_FILE=$(find src -type f \( -name "index.css" -o -name "app.css" -o -name "*.css" \) | head -n 1)
          if [ -n "$CSS_FILE" ]; then
            echo "Injecting mobile 2-column CSS into $CSS_FILE"
            cat << 'EOF' >> "$CSS_FILE"
          @media (max-width: 640px) {
            .grid {
              grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
              gap: 0.375rem !important;
            }
          }
          EOF
          fi

      - name: Install and Build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Package build output
        run: |
          # 查找编译后同时包含 index.html 和 assets 目录的文件夹（排除源码和依赖目录）
          OUT_DIR=""
          for f in $(find . -name "index.html" ! -path "./node_modules/*" ! -path "./public/*" ! -path "./.git/*"); do
            DIR=$(dirname "$f")
            if [ -d "$DIR/assets" ]; then
              OUT_DIR="$DIR"
              break
            fi
          done

          if [ -z "$OUT_DIR" ]; then
            echo "Build output directory not found! Listing directories:"
            find . -maxdepth 3 -type d ! -path "./node_modules*" ! -path "./.git*"
            exit 1
          fi

          echo "Detected exact build directory: $OUT_DIR"
          cd "$OUT_DIR"
          zip -r "$GITHUB_WORKSPACE/metacubexd-dist-patched.zip" ./*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-latest
          name: Custom Build (Mobile 2-Column)
          files: metacubexd-dist-patched.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
