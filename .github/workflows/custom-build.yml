name: Build Custom MetaCubeXD
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Patch UI Components & Styles
        run: |
          # 1. 精准修改代理节点网格为手机端双列（不修改全局 .grid，避免破坏底部导航和设置页）
          find packages/ui/components -type f -name "*.vue" -exec grep -l "grid-cols-1" {} + | xargs -r sed -i 's/grid-cols-1/grid-cols-2/g' || true

          # 2. 将选中节点的高亮边框样式替换为明显的背景色填充（类似旧版高对比度高亮）
          find packages/ui/components -type f -name "*Proxy*.vue" -exec sed -i 's/border-primary/border-primary bg-primary\/85 text-primary-content/g' {} + || true

          # 3. 注入专用 CSS：确保底部导航单排展示、配置页手机端上下布局
          CSS_FILE=$(find packages/ui/assets -type f -name "*.css" | head -n 1)
          if [ -n "$CSS_FILE" ]; then
            echo "Injecting custom layout CSS into $CSS_FILE"
            cat << 'EOF' >> "$CSS_FILE"

          /* 手机端设置页面强制恢复单列上下布局 */
          @media (max-width: 640px) {
            main .grid.grid-cols-2:has(input),
            main .grid.grid-cols-2:has(select),
            main .grid.md\:grid-cols-2 {
              grid-template-columns: minmax(0, 1fr) !important;
            }
            /* 底部导航栏强制单排等宽显示，防止图标折行被遮挡 */
            nav.btm-nav, footer .grid, nav .grid {
              display: flex !important;
              flex-direction: row !important;
              justify-content: space-around !important;
              align-items: center !important;
              flex-wrap: nowrap !important;
            }
          }
          EOF
          fi

          # 4. 创建客户端插件：默认打开进入代理页 + 底部导航快捷按钮（清 Fake-IP & 清 DNS 缓存）
          mkdir -p packages/ui/plugins
          cat << 'EOF' > packages/ui/plugins/custom-mobile-ux.client.ts
          export default defineNuxtPlugin((nuxtApp) => {
            if (typeof window === 'undefined') return

            // 1. 打开面板时如果处于首页/概览，自动跳转到代理页
            nuxtApp.hook('page:finish', () => {
              const hash = window.location.hash
              if (hash === '' || hash === '#/' || hash === '#/overview') {
                window.location.hash = '#/proxies'
              }
            })

            // 2. 在底部导航栏右侧动态挂载“清FakeIP”和“清DNS”快捷按钮
            const mountQuickActions = () => {
              if (document.getElementById('custom-nav-flush-group')) return
              const nav = document.querySelector('nav.btm-nav') || document.querySelector('footer') || document.querySelector('nav')
              if (!nav) return

              const getApiConfig = () => {
                try {
                  const raw = localStorage.getItem('endpoint') || localStorage.getItem('selectedEndpoint')
                  if (raw) {
                    const parsed = JSON.parse(raw)
                    const item = Array.isArray(parsed) ? parsed[0] : parsed
                    if (item?.url) return { url: item.url.replace(/\/$/, ''), secret: item.secret || '' }
                  }
                } catch {}
                return { url: window.location.origin, secret: '' }
              }

              const flushCache = async (type: 'fakeip' | 'dns', btn: HTMLButtonElement) => {
                const origText = btn.innerText
                btn.innerText = '...'
                try {
                  const { url, secret } = getApiConfig()
                  const headers: Record<string, string> = {}
                  if (secret) headers['Authorization'] = `Bearer ${secret}`
                  const res = await fetch(`${url}/cache/${type}/flush`, { method: 'POST', headers })
                  btn.innerText = res.ok ? '✓' : '!'
                } catch {
                  btn.innerText = '!'
                }
                setTimeout(() => { btn.innerText = origText }, 1200)
              }

              const box = document.createElement('div')
              box.id = 'custom-nav-flush-group'
              box.style.cssText = 'display:flex;flex-direction:column;gap:2px;justify-content:center;align-items:center;padding:0 4px;flex-shrink:0;'

              const mkBtn = (label: string, type: 'fakeip' | 'dns', color: string) => {
                const b = document.createElement('button')
                b.innerText = label
                b.style.cssText = `font-size:10px;line-height:1.2;padding:2px 5px;border-radius:4px;background:${color};color:#fff;font-weight:600;border:none;cursor:pointer;white-space:nowrap;`
                b.onclick = (e) => { e.stopPropagation(); flushCache(type, b) }
                return b
              }

              box.appendChild(mkBtn('清FakeIP', 'fakeip', '#8b5cf6'))
              box.appendChild(mkBtn('清DNS', 'dns', '#0ea5e9'))
              nav.appendChild(box)
            }

            setInterval(mountQuickActions, 1000)
          })
          EOF

      - name: Install and Build UI
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @metacubexd/ui generate || pnpm --filter ui generate || pnpm build

      - name: Package build output
        run: |
          OUT_DIR=$(find packages/ui -type f -name "index.html" -path "*/.output/public/*" | head -n 1 | xargs dirname)
          if [ -z "$OUT_DIR" ]; then
            OUT_DIR="packages/ui/.output/public"
          fi
          echo "Detected exact build directory: $OUT_DIR"
          cd "$OUT_DIR"

          # 转换绝对路径为相对路径，解决子路径 404 白屏问题
          grep -rl "/_nuxt/" . | xargs -r sed -i 's|"/_nuxt/|"./_nuxt/|g; s|'"'"'/_nuxt/|'"'"'./_nuxt/|g'
          rm -f sw.js workbox-*.js

          zip -r "$GITHUB_WORKSPACE/metacubexd-dist-patched.zip" ./*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-latest
          name: Custom Build (Mobile 2-Column)
          files: metacubexd-dist-patched.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
