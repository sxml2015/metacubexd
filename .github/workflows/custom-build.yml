name: Build Custom MetaCubeXD
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Patch mobile 2-column grid
        run: |
          grep -rl "grid-cols-1" . --exclude-dir={node_modules,.git} | xargs -r sed -i 's/grid-cols-1/grid-cols-2/g'

      - name: Install and Build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Package build output
        run: |
          # 精准定位编译产物目录（查找包含编译后带哈希 JS 文件的目录的上一级）
          ASSETS_DIR=$(find . -type f -name "index-*.js" ! -path "./node_modules/*" | head -n 1 | xargs dirname)
          OUT_DIR=$(dirname "$ASSETS_DIR")
          echo "Detected exact build directory: $OUT_DIR"
          cd "$OUT_DIR"
          zip -r "$GITHUB_WORKSPACE/metacubexd-dist-patched.zip" ./*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-latest
          name: Custom Build (Mobile 2-Column)
          files: metacubexd-dist-patched.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
